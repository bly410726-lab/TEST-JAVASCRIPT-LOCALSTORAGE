<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body>
   <div class="w-full">
    <div style="border-radius: 10px;" class=" mt-4 w-2/4 m-auto border-1 border-gray-500 p-4 shadow-2xl">
         <form id="form-submit" action="">
        <input style="border-radius: 10px;" class="w-full border-1 pl-4 py-2"  type="text" id="name" placeholder="Enter Username">
        <br>
        <br>
        <input style="border-radius: 10px;" class="w-full border-1 pl-4 py-2" type="text" id="gender" placeholder="Enber Gender">
        <br>
        <br>
        <input style="border-radius: 10px;" class="w-full border-1 pl-4 py-2" type="text" id="email" placeholder="Enter email">
        <br>
        <br>
         <input style="border-radius: 10px;" class="w-full border-1 pl-4 py-2" type="text" id="role" placeholder="Enter Role">
        <br>
        <br>
       <button type="submit" style="border-radius: 10px;" class="w-full border-1 pl-4 py-2 bg-blue-500 text-white hover:bg-white hover:text-blue-500 border-blue-500 transition-all">
        Submit
       </button>
    </form>
    </div>
    <div class=" m-full mt-7">
        <table id="table" class="w-full" id="table">
                <tr>
                    <th class="border-1 border-gray-300 py-4 bg-gray-200 ">
                        Id
                    </th>
                    <th class="border-1 border-gray-300 py-4 bg-gray-200 ">
                        Username
                    </th>
                    <th class="border-1 border-gray-300 py-4 bg-gray-200 ">
                        Gender
                    </th>
                    <th class="border-1 border-gray-300 py-4 bg-gray-200 ">
                        Email
                    </th>
                    <th class="border-1 border-gray-300 py-4 bg-gray-200 ">
                        Role
                    </th>
                    <th class="border-1 border-gray-300 py-4 bg-gray-200 ">
                        Action
                    </th>

                </tr>
                
                 
            </table>
    </div>
   </div>
</body>
<script src="indexe.js"></script>
</html>
